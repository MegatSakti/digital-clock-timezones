<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Digital Multizona</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🕐 Jam Digital</h1>
            <p>Waktu real-time di berbagai zona waktu</p>
        </header>

        <div class="controls">
            <div class="format-toggle">
                <label>Format:</label>
                <button class="format-btn active" id="format24" type="button" onclick="setFormat(24)">24 Jam</button>
                <button class="format-btn" id="format12" type="button" onclick="setFormat(12)">12 Jam</button>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 Cari zona waktu..." class="search-input">
                <div id="suggestions" class="suggestions-dropdown"></div>
            </div>
        </div>

        <div class="clocks-grid" id="clocksGrid"></div>

        <div class="digital-info" id="digitalInfo"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
